name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true
      # TEMPORARY: kamitani-lab.ist.i.kyoto-u.ac.jp was taken over by a third
      # party (2026-08). Until the domain is reclaimed via GitHub domain
      # verification, build for the github.io fallback URL so that assets
      # resolve and canonical/favicon links stop pointing at the hijacked host.
      # Remove the --baseURL override once the custom domain is restored.
      - run: hugo --minify --baseURL "https://kamitanilab.github.io/kamitani-lab-web/"
      - run: npx pagefind --site public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
