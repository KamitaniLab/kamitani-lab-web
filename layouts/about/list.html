{{ define "main" }}
<article class="pa3 pa4-ns mw8 center">
  <style>
    /* — About page sections — */
    .about-content h2 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #111;
      margin-top: 3rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 3px solid #111;
    }
    .about-content > h2:first-child {
      margin-top: 0;
    }

    /* — Sub-headings (location names) — */
    .about-content h3 {
      font-size: 1.2rem;
      font-weight: 900;
      color: #111;
      margin-top: 2.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.02em;
    }

    /* — Body text — */
    .about-content p {
      font-size: 1rem;
      color: #333;
      line-height: 1.75;
      margin-bottom: 1rem;
    }

    /* — Lists (links) — */
    .about-content ul {
      padding-left: 0;
      list-style: none;
      margin-top: 0.8rem;
    }
    .about-content li {
      font-size: 0.9rem;
      color: #333;
      line-height: 1.75;
      padding: 0.25rem 0;
      padding-left: 1rem;
      position: relative;
    }
    .about-content li::before {
      content: "\2192";
      position: absolute;
      left: 0;
      color: #999;
    }

    /* — Links — */
    .about-content a {
      color: #111;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .about-content a:hover {
      opacity: 0.6;
    }

    /* — Map embeds — */
    .about-content iframe {
      width: 100%;
      max-width: 640px;
      height: 300px;
      border: 2px solid #111;
      margin: 1rem 0;
      display: block;
    }

    /* — Bold text — */
    .about-content strong {
      font-weight: 900;
      color: #111;
    }

    /* — Resource cards (integrated from Resources page) — */
    .about-content .res-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin: 1rem 0 1.5rem;
    }
    .about-content .res-card {
      display: flex;
      align-items: center;
      padding: 1rem;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .about-content .res-card:hover {
      border-color: #999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .about-content .res-icon {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .about-content .res-info { margin-left: 0.75rem; }
    .about-content .res-name { font-weight: 700; font-size: 0.9rem; color: #111; }
    .about-content .res-desc { font-size: 0.85rem; color: #666; margin-top: 0.15rem; }
  </style>

  <div class="about-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
