{{ define "main" }}
<article class="pa3 pa4-ns mw8 center">
  <style>
    /* — About page sections — */
    .about-content h2 {
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #111;
      margin-top: 3.5rem;
      margin-bottom: 1.2rem;
      padding-bottom: 0.5rem;
      border-bottom: 3px solid #111;
    }
    .about-content > h2:first-child {
      margin-top: 0;
    }

    /* — Sub-headings (location names) — */
    .about-content h3 {
      font-size: 1.2rem;
      font-weight: 900;
      color: #111;
      margin-top: 2.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.02em;
    }

    /* — Body text — */
    .about-content p {
      font-size: 0.9rem;
      color: #333;
      line-height: 1.7;
      margin-bottom: 0.8rem;
    }

    /* — Lists (links) — */
    .about-content ul {
      padding-left: 0;
      list-style: none;
      margin-top: 0.8rem;
    }
    .about-content li {
      font-size: 0.85rem;
      color: #333;
      line-height: 1.7;
      padding: 0.2rem 0;
      padding-left: 1rem;
      position: relative;
    }
    .about-content li::before {
      content: "\2192";
      position: absolute;
      left: 0;
      color: #999;
    }

    /* — Links — */
    .about-content a {
      color: #111;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .about-content a:hover {
      opacity: 0.6;
    }

    /* — Map embeds — */
    .about-content iframe {
      width: 100%;
      max-width: 640px;
      height: 300px;
      border: 2px solid #111;
      margin: 1rem 0;
      display: block;
    }

    /* — Bold text — */
    .about-content strong {
      font-weight: 900;
      color: #111;
    }
  </style>

  <div class="about-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
