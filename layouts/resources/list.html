{{ define "main" }}
<article class="pa3 pa4-ns mw8 center">
  <style>
    .res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .res-card {
      display: flex;
      align-items: center;
      padding: 1rem;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .res-card:hover { border-color: #999; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .res-icon { width: 40px; height: 40px; border-radius: 4px; flex-shrink: 0; object-fit: contain; }
    .res-info { margin-left: 0.75rem; }
    .res-name { font-weight: 700; font-size: 0.9rem; color: #111; }
    .res-desc { font-size: 0.85rem; color: #666; margin-top: 0.15rem; }
  </style>

  <div class="ph3 ph5-l">
    {{ .Content }}
  </div>
</article>
{{ end }}
