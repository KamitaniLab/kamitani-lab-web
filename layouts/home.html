{{ define "main" }}

  <article class="cf ph3 ph5-l pv3 pv4-l f4 tc-l center measure-wide lh-copy nested-links mid-gray">
    {{ .Content }}
  </article>

  <div class="pa3 pa4-ns mw8 center">

    {{/* News (top, full width) */}}
    {{ $news := (where site.RegularPages "Section" "news").ByDate.Reverse }}
    {{ if $news }}
    <section class="mb5">
      <div class="flex items-center justify-between mb3">
        <h2 class="f3 fw9 mv0 ttu tracked ow-quote">News</h2>
        <a href="{{ "news/" | absURL }}" class="f6 link black fw7 ttu tracked">SEE ALL &rarr;</a>
      </div>
      {{ range first 5 $news }}
      <div class="pa2 mb2 bb bw1 b--black">
        <a href="{{ if .Params.link_url }}{{ .Params.link_url }}{{ else }}{{ .RelPermalink }}{{ end }}" class="f6 link black underline-hover lh-title db"{{ if .Params.link_url }} target="_blank" rel="noopener"{{ end }}>{{ .Title }}</a>
        <span class="f7 gray">{{ .Date.Format "2006-01-02" }}</span>
      </div>
      {{ end }}
    </section>
    {{ end }}

  </div>

{{ end }}
