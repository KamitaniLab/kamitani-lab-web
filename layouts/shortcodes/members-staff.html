<div class="members-grid">
{{ range .Site.Data.members.staff }}
<div class="member-card pa3 mb3 bb b--black">
  <h3 class="f4 fw7 mb1 ttu tracked">{{ .name }}</h3>
  <p class="f5 gray mt0 mb1">{{ .name_ja }}</p>
  <p class="f5 mb2">{{ .role }} / {{ .role_ja }}</p>
  {{ if .links }}
  <p class="f6">
    {{ range $i, $link := .links }}{{ if $i }} / {{ end }}<a href="{{ $link.url }}" class="link black underline-hover fw7">{{ $link.label }}</a>{{ end }}
  </p>
  {{ end }}
</div>
{{ end }}
</div>
