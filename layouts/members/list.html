{{ define "main" }}
  <article class="pa3 pa4-ns nested-copy-line-height">
    <style>
      .members-section {
        text-align: left;
        max-width: 60rem;
        margin: 0 auto;
      }
      .members-section h2 {
        font-size: 2.5rem;
        font-weight: 900;
        letter-spacing: -0.02em;
        color: #111;
        border-bottom: 3px solid #111;
        padding-bottom: 0.5rem;
        margin-top: 3rem;
        margin-bottom: 1.5rem;
      }
      .members-section h5 {
        font-weight: 400;
        font-size: 0.9rem;
        color: #666;
        margin-top: 0.25rem;
        margin-bottom: 0.25rem;
        text-transform: none;
        letter-spacing: normal;
        line-height: 1.5;
      }
      .members-section h3 {
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #555;
        font-size: 1.2rem;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
      }
      .members-section hr {
        border: none;
        border-top: 1px solid #ddd;
        margin: 2.5rem 0 0.5rem;
      }
      .members-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1px;
        background: #e0e0e0;
        border: 1px solid #e0e0e0;
      }
      .member-card {
        border-bottom: none !important;
        background: #fff;
        padding: 1rem 1.25rem !important;
        margin-bottom: 0 !important;
      }
      .member-card h3 {
        margin-top: 0;
        margin-bottom: 0.15rem;
        border: none;
        padding-bottom: 0;
        color: #111;
        font-size: 1rem;
        letter-spacing: 0.05em;
      }
      .member-card .f5 {
        font-size: 0.9rem !important;
      }
      .member-card .f6 {
        font-size: 0.8rem !important;
      }
      .member-card .f6 a {
        color: #111;
        text-decoration: underline;
        text-underline-offset: 2px;
        font-weight: 600;
      }
      .member-card .f6 a:hover {
        color: #555;
      }
    </style>
    <section class="cf ph3 ph5-l pv3 pv4-l f4 center lh-copy nested-links members-section {{ $.Param "text_color" | compare.Default "mid-gray" }}">
      {{- .Content -}}
    </section>
  </article>
{{ end }}
