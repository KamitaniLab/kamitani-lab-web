{{ define "main" }}
  <article class="pa3 pa4-ns nested-copy-line-height">
    <style>
      .members-section {
        text-align: left;
      }
      .members-section h2 {
        text-transform: uppercase;
        letter-spacing: 0.1em;
        border-bottom: 2px solid #111;
        padding-bottom: 0.5rem;
        margin-top: 2.5rem;
      }
      .members-section h3 {
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #555;
        margin-top: 1.5rem;
        margin-bottom: 1rem;
      }
      .members-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 0;
      }
      .member-card {
        border-bottom: 1px solid #ddd !important;
      }
      .member-card h3 {
        margin-top: 0;
        border: none;
        padding-bottom: 0;
        color: #111;
      }
    </style>
    <section class="cf ph3 ph5-l pv3 pv4-l f4 center measure-wide lh-copy nested-links members-section {{ $.Param "text_color" | compare.Default "mid-gray" }}">
      {{- .Content -}}
    </section>
  </article>
{{ end }}
